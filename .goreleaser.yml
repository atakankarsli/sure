version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: sure
    main: .
    binary: sure
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: sure
    ids:
      - sure
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Local artifacts only (goreleaser release --snapshot --clean). Publishing,
# GitHub releases and a Homebrew tap need the owner's go-ahead first.
release:
  disable: true
